[project]
name = "powerplant"
version = "0.1.0"
description = "Эталон мощности парогазовой установки: прогноз по погоде и контроль оборудования"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# В ноутбуке импорт пакета идёт после настройки sys.path, а длинные строки — подписи к таблицам.
"notebooks/*.ipynb" = ["E402", "E501", "I001"]
